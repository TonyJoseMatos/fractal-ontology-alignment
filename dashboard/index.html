<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FRACTAL ONTOLOGY ENGINE // TJM</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org"></script>
</head>
<body>
    <header class="tjm-cyber-header">
        <div class="logo">FRACTAL ONTOLOGY ALIGNMENT // TRACE v1.02</div>
        <div class="vessel-status">ENERGY STATUS: <span class="neon-glow">DEFERRED // TRANSFERRED</span></div>
    </header>

    <div class="dashboard-grid">
        <!-- Control Interface Terminal -->
        <section class="panel control-panel">
            <h2><span class="bracket">[</span> ENGINE CONTROL <span class="bracket">]</span></h2>
            <div class="control-group">
                <label>MATERIAL SCARCITY AXIS</label>
                <input type="text" id="axisA" value="K-Shaped Economic Squeeze (The Erased Middle)">
            </div>
            <div class="control-group">
                <label>ESCHATOLOGICAL ONTOLOGY AXIS</label>
                <input type="text" id="axisB" value="Sperm Rebirth Cycle / Cosmic Birth Pains">
            </div>
            <button id="synthesizeBtn" class="tjm-btn">TRIGGER VESSEL ALIGNMENT</button>
            
            <div class="terminal-log">
                <p class="sys-msg">> System clean. Superposition hypothesis discarded.</p>
                <p class="sys-msg">> Recursive generalization tracking enabled.</p>
                <div id="terminalOutput">> Awaiting ignition spark...</div>
            </div>
        </section>

        <!-- Neural Map Canvas Rendered in TJM style -->
        <section class="panel visualization-panel">
            <h2><span class="bracket">[</span> NATIVE EDGE MOTIF GEOMETRY <span class="bracket">]</span></h2>
            <div id="canvas-container">
                <svg id="networkSvg"></svg>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
